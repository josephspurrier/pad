<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pad</title>
<style>
  :root {
    --bg: #fbfaf7; --fg: #1d1d1b; --muted: #77756f; --line: #e6e3dc;
    --accent: #3b5bdb; --focus: #f1efe8; --warn: #b4521d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17171a; --fg: #e8e6e1; --muted: #8d8a83; --line: #2b2b30;
            --accent: #8ea4ff; --focus: #222227; --warn: #f0a070; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
           justify-content: space-between; padding: 14px 16px;
           border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  #status { color: var(--muted); font-size: 13px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #live::before { content: "●"; margin-right: 4px; color: var(--muted); }
  #live.on::before { color: #2f9e44; }
  button { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 6px;
           border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }
  #pad { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; }
  .chunk { padding: 2px 8px; min-height: 1.55em; border-radius: 4px;
           white-space: pre-wrap; word-break: break-word; outline: none; }
  .chunk[contenteditable]:focus { background: var(--focus); }
  .chunk.dirty { box-shadow: inset 2px 0 0 var(--accent); }
  #msg { color: var(--warn); font-size: 13px; min-height: 1.2em; margin-bottom: 12px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 24px; }
  #share { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 20px; font-size: 14px; }
  #share h2 { font-size: 14px; margin: 0 0 4px; }
  #share p { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  #editors { list-style: none; margin: 0 0 12px; padding: 0; }
  #editors li { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 4px 0;
                border-bottom: 1px solid var(--line); }
  #editors li.empty { color: var(--muted); border: 0; }
  #editors a { color: var(--accent); word-break: break-all; }
  #addForm { display: flex; gap: 8px; flex-wrap: wrap; }
  #webid { flex: 1 1 240px; min-width: 0; font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 6px;
           border: 1px solid var(--line); background: transparent; color: var(--fg); }
  #shareMsg { color: var(--muted); font-size: 12px; min-height: 1.2em; margin-top: 8px; }
  .menuwrap { position: relative; }
  #authMenu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; min-width: 230px;
              background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px;
              box-shadow: 0 6px 20px rgba(0,0,0,.15); }
  #authMenu button { display: block; width: 100%; text-align: left; border: 0; padding: 8px 10px; }
  #authMenu button:hover, #authMenu button:focus-visible { background: var(--focus); }
  #authMenu small { display: block; color: var(--muted); font-size: 11px; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Pad</h1>
  <div id="status">
    <span id="live">connecting</span>
    <span id="who">viewing as public</span>
    <button id="shareBtn" hidden aria-expanded="false" aria-controls="share">Editors</button>
    <span class="menuwrap">
      <button id="auth" hidden>Log in</button>
      <div id="authMenu" role="menu" hidden>
        <button id="logoutApp" role="menuitem">Log out of Pad<small>Stay signed in to Inrupt</small></button>
        <button id="logoutAll" role="menuitem">Log out of Pad and Inrupt<small>Next login asks which account</small></button>
      </div>
    </span>
  </div>
</header>
<main>
  <div id="msg"></div>
  <section id="share" hidden>
    <h2>Editors</h2>
    <p>Everyone can read this pad. People listed here can also edit it after logging in with their WebID.</p>
    <ul id="editors"></ul>
    <form id="addForm">
      <input id="webid" type="url" placeholder="https://id.inrupt.com/name" aria-label="WebID to add" required>
      <button type="submit">Add editor</button>
    </form>
    <div id="shareMsg" role="status"></div>
  </section>
  <div id="pad" aria-label="Pad text"></div>
  <p class="hint" id="hint" hidden>Enter splits a line, Backspace at the start of a line joins it to the line above, arrow keys move between lines. Edits save automatically.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@inrupt/solid-client-authn-browser@5.0.0/dist/solid-client-authn.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/n3@2.13.12/browser/n3.min.js"></script>
<script src="app.js"></script>
</body>
</html>
