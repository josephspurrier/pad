name: Deploy (GitHub Pages and Pod)

on:
  push:
    branches: [modern]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Cache busting: GitHub Pages serves everything with max-age=600, so a normal
      # reload can reuse an old app.js. Stamp local assets with the commit so a new
      # index.html always pulls the matching script.
      - name: Stamp asset URLs with the commit
        run: |
          v="${GITHUB_SHA::8}"
          mkdir -p _site
          cp index.html app.js client.jsonld .nojekyll _site/
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$v\"|" _site/index.html
          grep -q "app.js?v=$v" _site/index.html
          echo "stamped app.js?v=$v"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

  # Publish the read-only viewer to the Pod (pad/index.html, pad/app.js) with
  # deploy.sh. pad.ttl is only seeded if missing, so the pad text is never overwritten.
  pod:
    runs-on: ubuntu-latest
    concurrency:
      group: pod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Deploy viewer to the Pod
        env:
          SOLID_CLIENT_ID: ${{ secrets.SOLID_CLIENT_ID }}
          SOLID_CLIENT_SECRET: ${{ secrets.SOLID_CLIENT_SECRET }}
          SOLID_WEBID: ${{ vars.SOLID_WEBID }}
          SOLID_POD_ROOT: ${{ vars.SOLID_POD_ROOT }}
        run: zsh ./deploy.sh
